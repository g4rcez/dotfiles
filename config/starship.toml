"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
palette = "tokyonight"
format = """
$status\
${custom.dir}\
${custom.worktree}\
${custom.git_host}\
$git_branch\
$git_state\
$git_commit\
$git_status\
$git_metrics\
$fill\
${custom.since_last_commit}\
$lua\
$dotnet\
$nodejs\
$deno\
$docker_context\
$package\
$cmd_duration\
$line_break\
$character\
"""

[palettes.tokyonight]
bg = "#1a1b26"
bg_dark = "#16161e"
bg_highlight = "#292e42"
terminal_black = "#414868"
fg = "#c0caf5"
fg_dark = "#a9b1d6"
comment = "#565f89"
dark3 = "#545c7e"
blue = "#7aa2f7"
blue1 = "#2ac3de"
cyan = "#7dcfff"
green = "#9ece6a"
magenta = "#bb9af7"
purple = "#9d7cd8"
orange = "#ff9e64"
red = "#f7768e"
red_dark = "#db4b4b"
yellow = "#e0af68"
teal = "#1abc9c"

[docker_context]
format = '[ $context](cyan) '

[lua]
format = '[󰢱 $version](blue) '

[package]
disabled = false
display_private = true
format = '[$symbol$version]($style) '
style = "teal"
symbol = " "

[fill]
disabled = false
style = 'white'
symbol = " "

[status]
disabled = false
format = '[$symbol](yellow)$status ($style)'
map_symbol = true
style = 'fg:blue'
success_symbol = ''
symbol = ' '

[directory]
fish_style_pwd_dir_length = 1
format = '[$path]($style)[$read_only]($read_only_style) '
home_symbol = "~"
style = "blue"
truncation_length = 0

[character]
error_symbol = "[](red)"
success_symbol = "[[>_](fg)](fg)"
vimcmd_symbol = "[](green)"

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
style = "white"
symbol = ' '

[git_status]
ahead = '[⇡${count}](fg_dark) '
behind = '[⇣${count}](orange) '
conflicted = '[ ${count}](red) '
deleted = '[󰗨 ${count}](red) '
diverged = '[⇡${ahead_count}⇣${behind_count}](yellow) '
format = '([$conflicted$staged$modified$renamed$deleted$untracked$stashed$ahead_behind]($style) )'
modified = '[ ${count}](fg_dark) '
renamed = '[󰑕 ${count}](teal) '
staged = '[󰐕 ${count}](green) '
stashed = '[ ${count}](purple) '
style = "white"
untracked = '[ ${count}](blue1) '
up_to_date = ''

[git_state]
cherry_pick = '[ PICK](red)'
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "fg"

[git_metrics]
disabled = false
format = '([+$added](green) )([-$deleted](red_dark) )'
only_nonzero_diffs = true

[cmd_duration]
disabled = false
format = "[ 󰔛 $duration]($style) "
min_time = 10_000
min_time_to_notify = 10000
show_notifications = false
style = "yellow"

[dotnet]
disabled = false
format = '[$symbol($version)]($style) '
symbol = ' '

[deno]
detect_files = ['deno.json']
disabled = false
format = '[$symbol($version)]($style) '
symbol = ' '

[nodejs]
detect_extensions = []
detect_files = ['node_modules', 'package.json']
disabled = false
format = '[$symbol($version)]($style) '
style = "green"
symbol = ' '

[custom.since_last_commit]
description = "Show time since last commit"
format = "[󰚰 $output]($style) "
shell = ["bash", "--norc", "--noprofile"]
style = "purple"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
command = '''
ts=$(git log -1 --pretty=format:%cr 2>/dev/null) || exit 0
printf '%s' "${ts% ago}"
'''

[custom.git_host]
command = '''
url=$(git ls-remote --get-url 2>/dev/null) || exit 0
repo=${url%.git}
icon='󰊠'

url_decode() {
  local input=$1 output= char hex i
  for ((i = 0; i < ${#input}; i++)); do
    char=${input:i:1}
    if [[ $char == '%' && ${input:i+1:2} =~ ^[0-9A-Fa-f]{2}$ ]]; then
      hex=${input:i+1:2}
      printf -v char '%b' "\\x$hex"
      output+=$char
      ((i += 2))
    else
      output+=$char
    fi
  done
  printf '%s' "$output"
}

case "$repo" in
  git@github.com:*) icon=''; repo=${repo#git@github.com:} ;;
  https://github.com/*) icon=''; repo=${repo#https://github.com/} ;;
  git@gitlab.com:*) icon=''; repo=${repo#git@gitlab.com:} ;;
  https://gitlab.com/*) icon=''; repo=${repo#https://gitlab.com/} ;;
  git@bitbucket.org:*) icon=''; repo=${repo#git@bitbucket.org:} ;;
  https://bitbucket.org/*) icon=''; repo=${repo#https://bitbucket.org/} ;;
  git@ssh.dev.azure.com:v3/*/*/*) icon=''; repo=${repo#git@ssh.dev.azure.com:v3/}; repo=${repo#*/}; project=${repo%/*}; repo=${repo##*/}; repo="$project/$repo" ;;
  git@archlinux.org:*) icon='󰣇'; repo=${repo#git@archlinux.org:} ;;
  https://archlinux.org/*) icon='󰣇'; repo=${repo#https://archlinux.org/} ;;
  git@gnu.org:*) icon=''; repo=${repo#git@gnu.org:} ;;
  https://gnu.org/*) icon=''; repo=${repo#https://gnu.org/} ;;
  git@*:*|git://*/*) icon='󰊢' ;;
  https://*/*) icon='󰊢'; repo=${repo#https://}; repo=${repo#*/} ;;
  *) icon='󰊠' ;;
esac
repo=$(url_decode "$repo")
printf '%s %s' "$icon" "$repo"
'''
description = "Show icon of git host platform"
format = "[$output]($style) "
shell = ["bash", "--norc", "--noprofile"]
style = "white"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'

[custom.worktree]
command = "echo "
description = "Show icon when inside a git worktree"
format = "[$output]($style) "
shell = ["bash", "--norc", "--noprofile"]
style = "green"
when = '[ "$(cd "$(git rev-parse --git-dir 2>/dev/null)" && pwd)" != "$(cd "$(git rev-parse --git-common-dir 2>/dev/null)" && pwd)" ]'

[custom.dir]
command = """bun run $HOME/dotfiles/bin/fishfy-path"""
description = "Custom directory"
format = "[$output]($style) "
shell = ["bash", "--norc", "--noprofile"]
style = "blue"
when = 'true'
