[package]
name = "agentmux"
version = "0.1.0"
edition = "2024"
description = "A tmux-native dashboard for local coding agents"
license = "MIT"

[[bin]]
name = "gh-runs"
path = "src/bin/gh_runs.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
